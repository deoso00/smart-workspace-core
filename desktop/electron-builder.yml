appId: ai.zanto.desktop
productName: ZAntoAI
executableName: ZAntoAI
copyright: Copyright © ZAnto
directories:
  output: desktop/dist
  buildResources: desktop/build
files:
  - desktop/main.cjs
  - desktop/preload.cjs
  - desktop/README-INSTALL-IT.md
  - package.json
extraResources:
  - from: desktop/.output
    to: app-server
    filter:
      - "**/*"
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  artifactName: ZAnto-Setup-${version}.${ext}
  # Skip rcedit/winCodeSign — often hangs forever on Windows without a cert
  signAndEditExecutable: false
  verifyUpdateCodeSignature: false
portable:
  artifactName: ZAntoAI-Portable-${version}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ZAnto AI
  installerLanguages:
    - Italian
    - English
  artifactName: ZAnto-Setup-${version}.${ext}
extraMetadata:
  main: desktop/main.cjs
electronVersion: 37.2.0
